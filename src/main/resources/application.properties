spring.application.name=TrustyChain

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# JWT Configuration (REQUIRED for production)
# Generate a secure key with: openssl rand -base64 32
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Ollama Configuration
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:deepseek-r1:1.5b}

spring.mvc.async.request-timeout=600000

# Timestamp Authority Keys
trustychain.timestamp.private-key-path=${TIMESTAMP_PRIVATE_KEY:.keys/timestamp_private.pem}
trustychain.timestamp.public-key-path=${TIMESTAMP_PUBLIC_KEY:.keys/timestamp_public.pem}

# Suppress intentional security configuration warnings
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
logging.level.org.springframework.aop.framework.CglibAopProxy=ERROR
